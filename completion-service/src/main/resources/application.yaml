server:
  port: 8082
spring:
  application:
    name: completion-service
  threads:
    virtual:
      enabled: true
management:
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      maximum-expected-value:
        dynamodb_request: 10s
        verification_step: 1h
        withdrawal_verification: 2h
        withdrawal_end_to_end: 2h
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState, workerPool
completion:
  dynamodb:
    table-name: wallet-local
    endpoint: http://localhost:8000
    region: us-east-1
    max-connections: 200
  lock:
    max-attempts: 3
    max-backoff: 50ms
  kafka:
    bootstrap-servers: localhost:9092
    group-id: completion-service
  workers:
    count: 16
    queue-capacity: 64
    unknown-max-attempts: 10
    unknown-max-elapsed: 5m
