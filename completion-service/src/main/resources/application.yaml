server:
  port: 8082
spring:
  application:
    name: completion-service
  threads:
    virtual:
      enabled: true
management:
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
completion:
  dynamodb:
    table-name: wallet-local
    endpoint: http://localhost:8000
    region: us-east-1
    max-connections: 200
  lock:
    max-attempts: 3
    max-backoff: 50ms
  kafka:
    bootstrap-servers: localhost:9092
    group-id: completion-service
  workers:
    count: 16
    queue-capacity: 64
    unknown-max-attempts: 10
    unknown-max-elapsed: 5m
