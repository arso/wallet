server:
  port: 8080
spring:
  application:
    name: wallet-api
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
wallet:
  default-currency: USD
  dynamodb:
    table-name: wallet-local
    endpoint: http://localhost:8000
    region: us-east-1
    max-connections: 200
    create-table: true
  lock:
    max-attempts: 3
    max-backoff: 50ms
  idempotency:
    ttl: 24h
  verification:
    steps: aml, account_verified, beneficiary_credibility
  beneficiary:
    url: http://localhost:8090
    timeout: 2s
