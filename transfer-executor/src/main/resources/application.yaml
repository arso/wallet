server:
  port: 8084
spring:
  application:
    name: transfer-executor
  threads:
    virtual:
      enabled: true
management:
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      maximum-expected-value:
        dynamodb_request: 10s
        withdrawal_end_to_end: 2h
        transfer: 30m
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  server:
    port: 8085
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
executor:
  dynamodb:
    table-name: wallet-local
    endpoint: http://localhost:8000
    region: us-east-1
    max-connections: 200
  lock:
    max-attempts: 3
    max-backoff: 50ms
  kafka:
    bootstrap-servers: localhost:9092
    group-id: transfer-executor
  workers:
    max-in-flight: 256
    unknown-max-attempts: 10
    unknown-max-elapsed: 5m
  transfer:
    url: http://localhost:8090
    connect-timeout: 2s
    read-timeout: 10s
    retries: 5
    initial-backoff: 5s
  circuit:
    window-size: 50
    minimum-calls: 20
    failure-rate: 50
    open-wait: 30s
    half-open-calls: 5
